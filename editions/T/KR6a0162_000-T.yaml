body:
  text: 陰持入經序陳氏注密依自惟宿祚淳幸生遠八難之矇瞽值覩三尊之景輝洪潤普逮群生蒙澤使密鉛鋌之質獲廁圭壁之次雖覩神化稟懷淨誡然以魯鈍之否學不精勤夕夜𪫟惕懼忝大道命疾電耀躬膬薄氷疑滯之性學不通窈今以螢燭之耿裨天庭之日蓋陰持者行之號也與安般同原而別流安侯世高者普見菩薩也捐王位之榮安貧樂道夙興夜寐憂濟塗炭宣敷三寶光于京師於是俊人雲集遂致滋盛明哲之士靡不羨甘厥義郁郁淵泓難測植之過乎清乾橫之彌于八極洪洞浩洋無以為倫密睹其流稟玩忘飢因間麻緦為其注義差次條貫縷釋𧗪伍令其章斷句解使否者情通漸以進智才非生知揚不盡景猶以指渧之水助洪海之潤貴令暫睹之者差殊易曉唯願明哲留思三人察其訧睡幸加潤暢共顯三寶不誤將來矣
